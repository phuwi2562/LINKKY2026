<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#059669" />
  <title>ออฟไลน์ | KHAMYAI Health Portal</title>
  <style>
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      display: grid;
      place-items: center;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      color: #0f172a;
      background: linear-gradient(135deg, #f8fafc, #ecfdf5);
    }
    .card {
      width: min(100%, 420px);
      padding: 34px 26px;
      text-align: center;
      border-radius: 28px;
      background: white;
      box-shadow: 0 18px 45px rgba(15, 23, 42, .1);
    }
    .icon {
      width: 72px;
      height: 72px;
      margin: 0 auto 18px;
      display: grid;
      place-items: center;
      border-radius: 22px;
      color: white;
      font-size: 34px;
      font-weight: 700;
      background: #059669;
    }
    h1 { margin: 0 0 10px; font-size: 1.4rem; }
    p { margin: 0 0 22px; color: #475569; line-height: 1.6; }
    button {
      width: 100%;
      border: 0;
      border-radius: 16px;
      padding: 13px 18px;
      color: white;
      background: #059669;
      font-size: 1rem;
      font-weight: 650;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="icon">+</div>
    <h1>ยังไม่ได้เชื่อมต่ออินเทอร์เน็ต</h1>
    <p>กรุณาตรวจสอบสัญญาณอินเทอร์เน็ต แล้วลองเปิด KHAMYAI Health Portal อีกครั้ง</p>
    <button type="button" onclick="window.location.reload()">ลองใหม่อีกครั้ง</button>
  </main>
</body>
</html>
